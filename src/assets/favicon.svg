<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Montra — Espécies Arbóreas</title>
  <desc id="desc">Monograma minimalista M em tons botânicos verdes com a paleta oficial da floresta.</desc>

  <defs>
    <linearGradient id="field" x1="8" y1="4" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#051F20"/>
      <stop offset="1" stop-color="#0B2B26"/>
    </linearGradient>
    <linearGradient id="monogram" x1="14" y1="12" x2="49" y2="53" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DAF1DE"/>
      <stop offset="1" stop-color="#8EB69B"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="2" y="2" width="60" height="60" rx="13"/>
